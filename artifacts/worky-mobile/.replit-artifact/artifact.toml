kind = "mobile"
previewPath = "/worky-mobile/"
title = "Worky — Móvil"
description = "Aplicación móvil de Worky para clientes y profesionales: encontrar oficios, coordinar trabajos y acceder a conversaciones desde iOS y Android."
version = "1.0.0"
id = "artifacts/worky-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/worky-mobile/" ]
localPort = 24796

[services.development]
run = "pnpm --filter @workspace/worky-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/worky-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/worky-mobile", "run", "serve" ]

[services.env]
PORT = "24796"
BASE_PATH = "/worky-mobile/"
