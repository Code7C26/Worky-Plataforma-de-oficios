        - name: changaId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
        "403": { description: Not a conversation participant }
    post:
      operationId: proposeAppointment
      tags: [appointments]
      summary: Propose an appointment in a conversation
      parameters:
        - name: changaId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentInput" }
      responses:
        "201":
          description: Proposed appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { description: Invalid appointment date }
        "403": { description: Not allowed to propose }
  /chats/{changaId}/historial-visitas:
    get:
      operationId: listAppointmentAttempts
      tags: [appointments]
      summary: List coordination attempts for a conversation
      parameters:
        - name: changaId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Coordination attempt history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppointmentAttempt" }
        "403": { description: Not a conversation participant }
    post:
      operationId: logAppointmentAttempt
      tags: [appointments]
      summary: Log a coordination attempt outcome
      parameters:
        - name: changaId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentAttemptInput" }
      responses:
        "201":
          description: Logged coordination attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentAttempt" }
        "400": { description: Invalid attempt }
        "403": { description: Not a conversation participant }
  /citas/{id}/aceptar:
    post:
      operationId: acceptAppointment
      tags: [appointments]
      summary: Accept an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptAppointmentInput" }
      responses:
        "200":
          description: Accepted appointment or Mercado Pago checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptAppointmentResult" }
        "403": { description: Only the client can accept }
        "404": { description: Appointment not found }
        "409": { description: Payment or appointment state conflict }
  /citas/{id}/rechazar:
    post:
      operationId: rejectAppointment
      tags: [appointments]
      summary: Reject an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Rejected appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "403": { description: Only the client can reject }
        "404": { description: Appointment not found }
  /citas/{id}/llegada:
    post:
      operationId: recordVisitArrival
      tags: [appointments]
      summary: Record the Partner's arrival for a paid visit
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Arrival recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "403": { description: Only the Partner can record arrival }
        "404": { description: Appointment not found }
        "409": { description: Visit is not confirmed or time is too early }
  /citas/{id}/completar:
    post:
      operationId: completeVisit
      tags: [appointments]
      summary: Mark a visit completed and start the 24-hour review window
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Visit completed; Partner balance is held
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "403": { description: Only the Partner can complete the visit }
        "404": { description: Appointment not found }
        "409": { description: Arrival must be recorded first }
  /citas/{id}/confirmar-visita:
    post:
      operationId: confirmVisit
      tags: [appointments]
      summary: Confirm a visit and release the online balance early
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Visit confirmed and balance released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "403": { description: Only the client can confirm the visit }
        "404": { description: Appointment not found }
        "409": { description: Visit cannot yet be confirmed }
  /citas/{id}/reportar-problema:
    post:
      operationId: reportVisitIssue
      tags: [appointments]
      summary: Report a visit problem and hold its balance for review
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitIssueInput" }
      responses:
        "200":
          description: Report recorded; balance held
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { description: Invalid report }
        "403": { description: Visit participant access required }
        "404": { description: Appointment not found }
        "409": { description: Visit cannot be reported in this state }
  /notificaciones:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the current account
      responses:
        "200":
          description: Notifications and unread count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationListResponse" }
        "401": { description: Authentication required }
  /notificaciones/{id}/leida:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkyNotification" }
        "401": { description: Authentication required }
        "404": { description: Notification not found }
  /notificaciones/leidas:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "204": { description: All notifications marked as read }
        "401": { description: Authentication required }
  /partner/dashboard:
    get:
      operationId: getPartnerDashboard
      tags: [partner]
      summary: Get the current Partner dashboard summary
      responses:
        "200":
          description: Partner activity, upcoming appointments, files, and unread notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerDashboardResponse" }
        "401": { description: Authentication required }
        "403": { description: Partner role required }
  /partner/saldo-visitas:
    get:
      operationId: getPartnerVisitBalance
      tags: [partner]
      summary: Get the Partner balance and outstanding commissions
      responses:
        "200":
          description: Available and held visit funds plus remaining cash commissions from visits and jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerVisitBalance" }
        "401": { description: Authentication required }
        "403": { description: Partner role required }
  /partner/recommendation-ranking:
    get:
      operationId: getPartnerRecommendationRanking
      tags: [partner]
      summary: Get the active recommendation ranking status for the Partner
      description: Returns active false until a real job payment is confirmed in production.
      responses:
        "200":
          description: Ranking transparency and confirmed visit-balance signals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerRecommendationRankingStatus" }
        "401": { description: Authentication required }
        "403": { description: Approved Partner role required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ClientIdentityVerificationStatus:
      type: object
      additionalProperties: false
      required: [status, submittedAt, reviewedAt, reasonCode]
      properties:
        status: { type: string, enum: [not_requested, pending_verification, verified, rejected] }
        submittedAt: { type: ["string", "null"], format: date-time }
        reviewedAt: { type: ["string", "null"], format: date-time }
        reasonCode: { type: ["string", "null"], enum: [dni_unreadable, selfie_unusable, identity_mismatch, null] }
    SubmitClientIdentityVerificationInput:
      type: object
      additionalProperties: false
      required: [dniUploadId, selfieUploadId, consent]
      properties:
        dniUploadId: { type: number, minimum: 1 }
        selfieUploadId: { type: number, minimum: 1 }
        consent: { type: boolean, enum: [true] }
    AdminClientIdentityVerification:
      type: object
      additionalProperties: false
      required: [id, userId, name, email, submittedAt, hasDni, hasSelfie]
      properties:
        id: { type: number }
        userId: { type: number }
        name: { type: string }
        email: { type: string }
        submittedAt: { type: string, format: date-time }
        hasDni: { type: boolean }
        hasSelfie: { type: boolean }
