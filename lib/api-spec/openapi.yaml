          description: Status only; private images and file paths are never returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientIdentityVerificationStatus" }
        "401": { description: Authentication required }
        "403": { description: Customer role required }
    post:
      operationId: submitClientIdentityVerification
      tags: [auth]
      summary: Submit a DNI photo and selfie for private Worky review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitClientIdentityVerificationInput" }
      responses:
        "201":
          description: Request submitted for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientIdentityVerificationStatus" }
        "400": { description: Invalid or unreadable image }
        "401": { description: Authentication required }
        "403": { description: Customer role required }
        "409": { description: A request is already being reviewed or identity is verified }
  /auth/profile-photo:
    post:
      operationId: updateMyProfilePhoto
      tags: [auth]
      summary: Set the authenticated account profile photo from an uploaded source image
      security:
        - bearerAuth: []
      requestBody:
        required: true
