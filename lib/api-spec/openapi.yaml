        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /trabajos/mias:
    get:
      operationId: listMyJobs
      tags: [jobs]
      summary: List jobs created by the current user
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
  /trabajos/disponibles:
    get:
      operationId: listAvailableJobs
      tags: [jobs]
      summary: List jobs available to the current professional
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
  /trabajos/asignadas:
    get:
      operationId: listAssignedJobs
      tags: [jobs]
      summary: List jobs assigned to the current professional
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
  /trabajos/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update job state
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobUpdate" }
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /trabajos/{id}/aceptar:
    patch:
      operationId: acceptJob
      tags: [jobs]
      summary: Accept an available job
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Accepted job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /conversaciones:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List the current user's conversations
      parameters:
        - name: rol
          in: query
          schema: { type: string, enum: [cliente, profesional] }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Conversation" }
  /chats/{changaId}/mensajes:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages for a job
      parameters:
        - name: changaId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      operationId: createMessage
      tags: [messages]
      summary: Send a message
      parameters:
        - name: changaId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
  /chats/{changaId}/leidos:
    post:
      operationId: markMessagesRead
      tags: [messages]
      summary: Mark the other participant's messages as read
      parameters:
        - name: changaId
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Messages marked as read
  /chats/{changaId}/citas:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments for a conversation
      parameters:
        - name: changaId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
        "403": { description: Not a conversation participant }
    post:
      operationId: proposeAppointment
      tags: [appointments]
      summary: Propose an appointment in a conversation
      parameters:
        - name: changaId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentInput" }
      responses:
        "201":
          description: Proposed appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { description: Invalid appointment date }
        "403": { description: Not allowed to propose }
  /chats/{changaId}/historial-visitas:
    get:
      operationId: listAppointmentAttempts
      tags: [appointments]
      summary: List coordination attempts for a conversation
      parameters:
        - name: changaId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Coordination attempt history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppointmentAttempt" }
        "403": { description: Not a conversation participant }
    post:
      operationId: logAppointmentAttempt
      tags: [appointments]
      summary: Log a coordination attempt outcome
      parameters:
        - name: changaId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentAttemptInput" }
      responses:
        "201":
          description: Logged coordination attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentAttempt" }
        "400": { description: Invalid attempt }
        "403": { description: Not a conversation participant }
  /citas/{id}/aceptar:
    post:
      operationId: acceptAppointment
      tags: [appointments]
      summary: Accept an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Accepted appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "403": { description: Only the client can accept }
        "404": { description: Appointment not found }
  /citas/{id}/rechazar:
    post:
      operationId: rejectAppointment
      tags: [appointments]
      summary: Reject an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Rejected appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "403": { description: Only the client can reject }
        "404": { description: Appointment not found }
  /notificaciones:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the current account
      responses:
        "200":
          description: Notifications and unread count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationListResponse" }
        "401": { description: Authentication required }
  /notificaciones/{id}/leida:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkyNotification" }
        "401": { description: Authentication required }
        "404": { description: Notification not found }
  /notificaciones/leidas:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "204": { description: All notifications marked as read }
        "401": { description: Authentication required }
  /partner/dashboard:
    get:
      operationId: getPartnerDashboard
      tags: [partner]
      summary: Get the current Partner dashboard summary
      responses:
        "200":
          description: Partner activity, upcoming appointments, files, and unread notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerDashboardResponse" }
        "401": { description: Authentication required }
        "403": { description: Partner role required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AdminDashboard:
      type: object
      required: [accountsTotal, accountsActive, partnersTotal, partnersPendingReview, partnersVerified, partnersEnabled, jobsTotal, bookingsTotal, paymentsTotal, settlementsTotal, reviewsTotal, recommendationsTotal, catalogItems, portfolioAssets, profilePhotos, chatMessages, recentActivity]
      properties:
        accountsTotal: { type: number }
        accountsActive: { type: number }
        partnersTotal: { type: number }
        partnersPendingReview: { type: number }
        partnersVerified: { type: number }
        partnersEnabled: { type: number }
        jobsTotal: { type: number }
        bookingsTotal: { type: number }
        paymentsTotal: { type: number }
        settlementsTotal: { type: number }
        reviewsTotal: { type: number }
        recommendationsTotal: { type: number }
        catalogItems: { type: number }
        portfolioAssets: { type: number }
        profilePhotos: { type: number }
        chatMessages: { type: number }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/AdminActivityEvent" }
    AdminAccount:
      type: object
      required: [id, name, email, role, active, emailVerifiedAt, createdAt, city]
      properties:
        id: { type: number }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        role: { type: string, enum: [cliente, profesional, admin] }
        active: { type: boolean }
        emailVerifiedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        city: { type: ["string", "null"] }
    AdminAccountPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminAccount" }
        total: { type: number }
        page: { type: number }
        limit: { type: number }
    AdminAccountStatusInput:
      type: object
      required: [active, reason]
      properties:
        active: { type: boolean }
        reason: { type: string, minLength: 5, maxLength: 1000 }
    AdminVerificationDocumentSummary:
      type: object
      required: [id, type, status, name, sizeBytes, createdAt]
      properties:
        id: { type: number }
        type: { type: string, enum: [dni_frente, dni_dorso, antecedentes_penales] }
        status: { type: string, enum: [pending_verification, verified, rejected] }
        name: { type: string }
        sizeBytes: { type: number }
        createdAt: { type: string, format: date-time }
    AdminPartner:
      type: object
      required: [userId, name, email, trade, category, verificationStatus, verified, enabled, accountActive, available, experienceYears, referencePrice, rating, createdAt, documents]
      properties:
        userId: { type: number }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        trade: { type: string }
        category: { type: string }
        verificationStatus: { type: string, enum: [pending_verification, verified, rejected] }
        verified: { type: boolean }
        enabled: { type: boolean }
        accountActive: { type: boolean }
        available: { type: boolean }
        experienceYears: { type: number }
        referencePrice: { type: number }
        rating: { type: number }
        createdAt: { type: string, format: date-time }
        documents:
          type: array
          items: { $ref: "#/components/schemas/AdminVerificationDocumentSummary" }
    AdminPartnerPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminPartner" }
        total: { type: number }
        page: { type: number }
        limit: { type: number }
    AdminPartnerActivationInput:
      type: object
      required: [enabled, reason]
      properties:
        enabled: { type: boolean }
        reason: { type: string, minLength: 5, maxLength: 1000 }
    AdminJob:
      type: object
      required: [id, category, status, clientId, clientName, partnerId, partnerName, detail, offeredPrice, createdAt]
      properties:
        id: { type: number }
        category: { type: string }
        status: { type: string }
        clientId: { type: number }
        clientName: { type: string }
        partnerId: { type: ["number", "null"] }
        partnerName: { type: ["string", "null"] }
        detail: { type: ["string", "null"] }
        offeredPrice: { type: number }
        createdAt: { type: string, format: date-time }
    AdminJobPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminJob" }
        total: { type: number }
        page: { type: number }
        limit: { type: number }
    AdminBooking:
