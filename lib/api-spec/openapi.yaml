        "200":
          description: Profile photo saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilePhotoUpdateResult" }
        "400": { description: Invalid or missing uploaded source image }
        "401": { description: Authentication required }
        "500": { description: Could not save profile photo }
    delete:
      operationId: deleteMyProfilePhoto
      tags: [auth]
      summary: Remove the authenticated account profile photo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile photo removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilePhotoRemovalResult" }
