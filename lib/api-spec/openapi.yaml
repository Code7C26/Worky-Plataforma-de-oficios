openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api/v1
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storage
    description: File storage operations
  - name: professionals
  - name: jobs
  - name: messages
  - name: appointments
  - name: auth
  - name: notifications
  - name: partner
  - name: admin
    description: Administrative operations for Worky
paths:
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get administrative dashboard totals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Administrative totals and recent activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/accounts:
    get:
      operationId: listAdminAccounts
      tags: [admin]
      summary: Search account records
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: role, schema: { type: string, enum: [cliente, profesional, admin] } }
        - { in: query, name: active, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Account page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccountPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/accounts/{id}/status:
    patch:
      operationId: updateAdminAccountStatus
      tags: [admin]
      summary: Suspend or reactivate a non-administrator account
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAccountStatusInput" }
      responses:
        "200":
          description: Updated account status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccount" }
        "400": { description: Invalid status change }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Account not found }
        "409": { description: Account cannot be changed }
  /admin/partners:
    get:
      operationId: listAdminPartners
      tags: [admin]
      summary: Search Partner profiles and their document states
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: verificationStatus, schema: { type: string, enum: [pending_verification, verified, rejected] } }
        - { in: query, name: enabled, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Partner page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPartnerPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/partners/{id}/activation:
    patch:
      operationId: updateAdminPartnerActivation
      tags: [admin]
      summary: Enable or suspend a verified Partner profile
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPartnerActivationInput" }
      responses:
        "200":
          description: Updated Partner activation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPartner" }
        "400": { description: Invalid status change }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Partner not found }
        "409": { description: Partner cannot be enabled before verification or while the account is suspended }
  /admin/jobs:
    get:
      operationId: listAdminJobs
      tags: [admin]
      summary: Search job records
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Job page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJobPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/bookings:
    get:
      operationId: listAdminBookings
      tags: [admin]
      summary: Search booking records
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Booking page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBookingPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [admin]
      summary: Search payment records without provider secrets
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Payment page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPaymentPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/settlements:
    get:
      operationId: listAdminSettlements
      tags: [admin]
      summary: Search Partner settlement records
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Settlement page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettlementPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/reviews:
    get:
      operationId: listAdminReviews
      tags: [admin]
      summary: Search review records
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Review page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReviewPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/recommendations:
    get:
      operationId: listAdminRecommendations
      tags: [admin]
      summary: Search recommendation records
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: visibility, schema: { type: string, enum: [publica, privada] } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Recommendation page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRecommendationPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/recommendations/{id}/visibility:
    patch:
      operationId: updateAdminRecommendationVisibility
      tags: [admin]
      summary: Change the public visibility of a recommendation
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRecommendationVisibilityInput" }
      responses:
        "200":
          description: Updated recommendation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRecommendation" }
        "400": { description: Invalid visibility }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Recommendation not found }
  /admin/catalog:
    get:
      operationId: listAdminCatalog
      tags: [admin]
      summary: List active and inactive service catalog entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Catalog entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
    post:
      operationId: createAdminCatalogItem
      tags: [admin]
      summary: Add an entry to the service catalog
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCatalogInput" }
      responses:
        "201":
          description: Created catalog entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "400": { description: Invalid catalog entry }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "409": { description: Catalog entry already exists }
  /admin/catalog/{id}:
    patch:
      operationId: updateAdminCatalogItem
      tags: [admin]
      summary: Update or deactivate a service catalog entry
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCatalogUpdate" }
      responses:
        "200":
          description: Updated catalog entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "400": { description: Invalid catalog entry }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Catalog entry not found }
        "409": { description: Catalog entry already exists }
  /admin/resources:
    get:
      operationId: listAdminResources
      tags: [admin]
      summary: Inventory public Partner portfolio and profile image metadata
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Resource metadata page; private chat content is not included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResourcePage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/activity:
    get:
      operationId: listAdminActivity
      tags: [admin]
      summary: List auditable administrative and operational events
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: entity, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Audit event page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminActivityPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/verificaciones:
    get:
      operationId: listAdminVerifications
      tags: [admin]
      summary: List private Partner verification documents by status
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: estado, schema: { type: string, enum: [pending_verification, verified, rejected] } }
      responses:
        "200":
          description: Verification documents for authorized administrative review
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminVerificationDocument" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/verificaciones/{id}:
    patch:
      operationId: resolveAdminVerification
      tags: [admin]
      summary: Approve or reject a pending verification document
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVerificationDecisionInput" }
      responses:
        "200":
          description: Verification decision and resulting Partner verification state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVerificationDecisionResult" }
        "400": { description: Invalid verification decision }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Verification document not found }
        "409": { description: Verification document already resolved }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Prepare a signed upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Signed upload destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
        "400": { description: Invalid upload metadata }
        "403": { description: Not allowed to upload to this conversation }
        "500": { description: Could not prepare the upload }
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRegisterInput" }
      responses:
        "201":
          description: Created account and session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { description: Invalid registration data }
        "409": { description: Email already in use }
  /auth/email-verification/account/request:
    post:
      operationId: requestAccountEmailVerification
      tags: [auth]
      summary: Send a one-time code to verify the current account email
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Verification code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailVerificationMessage" }
        "401": { description: Authentication required }
        "409": { description: Email already verified }
        "429": { description: Too many requests }
        "503": { description: Email delivery unavailable }
  /auth/email-verification/account/confirm:
    post:
      operationId: confirmAccountEmailVerification
      tags: [auth]
      summary: Confirm a code for the current account email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountEmailVerificationConfirmation" }
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailVerificationResult" }
        "400": { description: "Invalid, expired, or already used code" }
        "401": { description: Authentication required }
        "429": { description: Too many attempts }
  /auth/admin-signup/request:
    post:
      operationId: requestAdminSignupCode
      tags: [auth]
      summary: Request a verification code for an allowlisted administrator email
      description: Sends a one-time code only when the email is in the server-side allowlist. The response does not reveal allowlist membership.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSignupRequest" }
      responses:
        "202":
          description: Generic response whether or not a code was sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSignupRequestResult" }
        "400": { description: Invalid email }
        "429": { description: Too many attempts }
        "503": { description: Admin signup is not configured or email delivery is unavailable }
  /auth/admin-signup/complete:
    post:
      operationId: completeAdminSignup
      tags: [auth]
      summary: Create or promote an account after email verification
      description: Requires an allowlisted email, a valid one-time code, and the existing password when the Worky account already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSignupCompletion" }
      responses:
        "200":
          description: Existing account promoted or already administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "201":
          description: New administrator account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { description: Invalid or expired code or invalid input }
        "401": { description: Existing account password did not match }
        "409": { description: Existing account cannot be activated by this flow }
        "422": { description: New administrator password must have at least 12 characters }
        "429": { description: Too many attempts }
        "503": { description: Admin signup is not configured }
  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Sign in to an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthCredentials" }
      responses:
        "200":
          description: Account session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Invalid email or password }
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: End the current session
      responses:
        "204": { description: Session ended }
        "401": { description: Invalid session }
  /auth/location:
    patch:
      operationId: updateProfessionalLocation
      tags: [professionals]
      summary: Update the current professional's live location
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessionalLocationUpdate" }
      responses:
        "200":
          description: Updated live location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfessionalLocation" }
        "400": { description: Invalid coordinates }
        "403": { description: Only professionals can update a live location }
  /auth/me:
    get:
      operationId: getMyAccount
      tags: [professionals]
      summary: Get the current account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { description: Invalid session }
    patch:
      operationId: updateMyAccount
      tags: [professionals]
      summary: Update the current account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: Invalid account data }
        "401": { description: Current password required or invalid session }
        "409": { description: Email already in use }
  /auth/role:
    patch:
      operationId: switchAccountRole
      tags: [professionals]
      summary: Switch the current account between client and professional modes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountRoleUpdate" }
      responses:
        "200":
          description: Updated account role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: Invalid account role }
        "401": { description: Invalid session }
        "403": { description: Administrator accounts cannot switch roles }
  /auth/password:
    patch:
      operationId: changeMyPassword
      tags: [professionals]
      summary: Change the current account password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "400": { description: Invalid password }
        "401": { description: Current password is incorrect }
  /auth/password-recovery/request:
    post:
      operationId: requestPasswordRecovery
      tags: [professionals]
      summary: Request a password recovery link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRecoveryRequest" }
      responses:
        "202":
          description: Recovery request accepted without revealing whether the email exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordRecoveryResponse" }
        "400": { description: Invalid email }
        "503": { description: Email delivery unavailable }
  /auth/password-recovery/reset:
    post:
      operationId: resetPasswordRecovery
      tags: [professionals]
      summary: Set a new password with a recovery token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRecoveryReset" }
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "400": { description: "Invalid, expired, or already used token" }
  /profesionales:
    get:
      operationId: listProfessionals
      tags: [professionals]
      summary: List professionals
      parameters:
        - name: categoria
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: number, minimum: 1, maximum: 50 }
        - name: latitud
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitud
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Professionals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfessionalProfile" }
  /profesionales/{id}:
    get:
      operationId: getProfessional
      tags: [professionals]
      summary: Get a professional
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Professional
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfessionalProfile" }
        "404": { description: Not found }
  /profesionales/{id}/reputacion:
    get:
      operationId: getProfessionalReputation
      tags: [professionals]
      summary: Get a professional reputation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Reputation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfessionalReputation" }
        "404": { description: Not found }
  /partner-profile:
    post:
      operationId: createMyProfessionalProfile
      tags: [professionals]
      summary: Create the current user's professional profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessionalProfileInput" }
      responses:
        "201":
          description: Created profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfessionalProfile" }
        "200":
          description: Existing profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfessionalProfile" }
  /partner-profile/me:
    get:
      operationId: getMyProfessionalProfile
      tags: [professionals]
      summary: Get current professional profile
      responses:
        "200":
          description: Current profile or null when it has not been created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProfessionalProfile"
                  - type: "null"
    put:
      operationId: updateMyProfessionalProfile
      tags: [professionals]
      summary: Update current professional profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessionalProfileInput" }
      responses:
        "200":
          description: Updated profile
