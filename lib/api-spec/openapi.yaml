    AdminReviewPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminReview" }
        total: { type: number }
        page: { type: number }
        limit: { type: number }
    AdminRecommendation:
      type: object
      required: [id, clientId, clientName, partnerId, partnerName, visibility, comment, createdAt, updatedAt]
      properties:
        id: { type: number }
        clientId: { type: number }
        clientName: { type: string }
        partnerId: { type: number }
        partnerName: { type: string }
        visibility: { type: string, enum: [publica, privada] }
        comment: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminRecommendationPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminRecommendation" }
        total: { type: number }
        page: { type: number }
        limit: { type: number }
    AdminRecommendationVisibilityInput:
      type: object
      required: [visibility, reason]
      properties:
        visibility: { type: string, enum: [publica, privada] }
        reason: { type: string, minLength: 5, maxLength: 1000 }
    AdminCatalogItem:
      type: object
      required: [id, category, specialty, active, createdAt, updatedAt]
      properties:
        id: { type: number }
        category: { type: string }
        specialty: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminCatalogInput:
      type: object
      required: [category, specialty]
      properties:
        category: { type: string, minLength: 1, maxLength: 100 }
        specialty: { type: string, minLength: 1, maxLength: 120 }
    AdminCatalogUpdate:
      type: object
      properties:
        category: { type: string, minLength: 1, maxLength: 100 }
        specialty: { type: string, minLength: 1, maxLength: 120 }
        active: { type: boolean }
    AdminResource:
      type: object
      required: [id, ownerId, ownerName, kind, name, contentType, sizeBytes, createdAt]
      properties:
        id: { type: number }
        ownerId: { type: number }
        ownerName: { type: string }
        kind: { type: string, enum: [portfolio, profile_photo] }
        name: { type: string }
        contentType: { type: string }
        sizeBytes: { type: ["number", "null"] }
        createdAt: { type: string, format: date-time }
    AdminResourcePage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminResource" }
        total: { type: number }
        page: { type: number }
        limit: { type: number }
    AdminActivityEvent:
      type: object
      required: [id, actorId, actorName, entity, entityId, action, previousState, nextState, metadata, createdAt]
      properties:
        id: { type: number }
        actorId: { type: ["number", "null"] }
        actorName: { type: ["string", "null"] }
        entity: { type: string }
        entityId: { type: number }
        action: { type: string }
        previousState: { type: ["string", "null"] }
        nextState: { type: ["string", "null"] }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AdminActivityPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminActivityEvent" }
        total: { type: number }
        page: { type: number }
        limit: { type: number }
    AdminVerificationDocument:
      type: object
      required: [id, profesionalId, tipo, objectPath, nombre, contentType, sizeBytes, estado, createdAt, updatedAt, partner, perfil]
      properties:
        id: { type: number }
        profesionalId: { type: number }
        tipo: { type: string, enum: [dni_frente, dni_dorso, antecedentes_penales] }
        objectPath: { type: string }
        nombre: { type: string }
        contentType: { type: string }
        sizeBytes: { type: number }
        estado: { type: string, enum: [pending_verification, verified, rejected] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        partner:
          type: object
          required: [id, nombre, email]
          properties:
            id: { type: number }
            nombre: { type: string }
            email: { type: string }
        perfil:
          oneOf:
            - type: object
              required: [oficio, categoria, estadoVerificacion]
              properties:
                oficio: { type: string }
                categoria: { type: string }
                estadoVerificacion: { type: string, enum: [pending_verification, verified, rejected] }
            - type: "null"
    AdminVerificationDecisionInput:
      type: object
      required: [estado, motivo]
      properties:
        estado: { type: string, enum: [verified, rejected] }
        motivo: { type: string, minLength: 1, maxLength: 1000 }
    AdminVerificationDecisionResult:
      type: object
      required: [id, estado, profileStatus]
      properties:
        id: { type: number }
        estado: { type: string, enum: [verified, rejected] }
        profileStatus: { type: string, enum: [pending_verification, verified, rejected] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthCredentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 200 }
    AuthRegisterInput:
      type: object
      required: [nombre, email, password]
      properties:
        nombre: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, maxLength: 320 }
        password: { type: string, minLength: 6, maxLength: 200 }
        telefono: { type: string, maxLength: 40 }
        edad: { type: number, minimum: 13, maximum: 120 }
        rol: { type: string, enum: [cliente, profesional] }
        ubicacion: { $ref: "#/components/schemas/UserLocation" }
        onboardingRespuestas:
          type: object
          additionalProperties: { type: string }
    AccountEmailVerificationConfirmation:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$", minLength: 6, maxLength: 6 }
    EmailVerificationMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }
    EmailVerificationResult:
      type: object
      required: [verified]
      properties:
        verified: { type: boolean }
    AdminSignupRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, maxLength: 320 }
    AdminSignupRequestResult:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string }
    AdminSignupCompletion:
      type: object
      additionalProperties: false
      required: [nombre, email, password, codigo]
      properties:
        nombre: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, maxLength: 320 }
        password: { type: string, minLength: 6, maxLength: 200 }
        codigo: { type: string, pattern: "^[0-9]{6}$" }
    AuthSession:
      type: object
      required: [token, usuario]
      properties:
        token: { type: string }
        usuario: { $ref: "#/components/schemas/Account" }
    ProfessionalLocationUpdate:
      type: object
      required: [coordinates]
      properties:
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
    ProfessionalLocation:
      type: object
      required: [coordinates, capturedAt]
      properties:
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
        capturedAt: { type: string, format: date-time }
    Account:
      type: object
      required: [id, nombre, email, rol, emailVerifiedAt]
      properties:
        id: { type: number }
        nombre: { type: string }
        email: { type: string }
        emailVerifiedAt: { type: ["string", "null"], format: date-time }
        telefono: { type: ["string", "null"] }
