openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api/v1
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storage
    description: File storage operations
  - name: professionals
  - name: jobs
  - name: messages
  - name: appointments
  - name: auth
  - name: notifications
  - name: partner
  - name: admin
    description: Administrative operations for Worky
paths:
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get administrative dashboard totals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Administrative totals and recent activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/accounts:
    get:
      operationId: listAdminAccounts
      tags: [admin]
      summary: Search account records
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: role, schema: { type: string, enum: [cliente, profesional, admin] } }
        - { in: query, name: active, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Account page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccountPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/admins:
    get:
      operationId: listAdminManagers
      tags: [admin]
      summary: List administrator accounts for the primary administrator
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Delegated administrator accounts and primary-account status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminManagerPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/admins/{id}/role:
    patch:
      operationId: revokeAdminRole
      tags: [admin]
      summary: Remove an administrator role
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRoleRevokeInput" }
      responses:
        "200": { description: Administrator role removed }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Primary administrator required }
        "404": { description: Account not found }
        "409": { description: Account cannot be changed }
  /admin/accounts/{id}/status:
    patch:
      operationId: updateAdminAccountStatus
      tags: [admin]
      summary: Suspend or reactivate a non-administrator account
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAccountStatusInput" }
      responses:
        "200":
          description: Updated account status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccount" }
        "400": { description: Invalid status change }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Account not found }
        "409": { description: Account cannot be changed }
  /admin/cuentas/rol:
    patch:
      operationId: grantAdminRole
      tags: [admin]
      summary: Assign the administrator role to a verified active account
      description: Requires the configured primary administrator and records an audit event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRoleGrantInput" }
      responses:
        "200":
          description: Role assigned or unchanged if the account was already an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoleGrantResult" }
        "400": { description: "Invalid email, reason, or fields" }
        "401": { description: Authentication required }
        "403": { description: Administrator role required }
        "404": { description: Account not found }
        "409": { description: "Account is disabled, unverified, or changed concurrently" }
  /admin/partner-applications:
    get:
      operationId: listAdminPartnerApplications
      tags: [admin]
      summary: Solicitudes de habilitación agrupadas por perfil con documentación privada
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: number, default: 1 } }
        - { name: limit, in: query, schema: { type: number, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Perfiles sin habilitar y todos sus documentos, incluidos los ya revisados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPartnerApplicationPage" }
        "401": { description: Sesión requerida }
        "403": { description: Se requiere rol admin }
  /admin/partners:
    get:
      operationId: listAdminPartners
      tags: [admin]
      summary: Search Partner profiles and their document states
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: verificationStatus, schema: { type: string, enum: [pending_verification, verified, rejected] } }
        - { in: query, name: enabled, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Partner page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPartnerPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/partners/{id}/activation:
    patch:
      operationId: updateAdminPartnerActivation
      tags: [admin]
      summary: Enable or suspend a verified Partner profile
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPartnerActivationInput" }
      responses:
        "200":
          description: Updated Partner activation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPartner" }
        "400": { description: Invalid status change }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Partner not found }
        "409": { description: Partner cannot be enabled before verification or while the account is suspended }
  /admin/jobs:
    get:
      operationId: listAdminJobs
      tags: [admin]
      summary: Search job records
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Job page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJobPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/bookings:
    get:
      operationId: listAdminBookings
      tags: [admin]
      summary: Search booking records
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Booking page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBookingPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [admin]
      summary: Search payment records without provider secrets
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Payment page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPaymentPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/settlements:
    get:
      operationId: listAdminSettlements
      tags: [admin]
      summary: Search Partner settlement records
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Settlement page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettlementPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/visits:
    get:
      operationId: listAdminVisitPayments
      tags: [admin]
      summary: Search visit payments and reports
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Visit payment records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVisitPaymentPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/visits/{id}/resolver:
    post:
      operationId: resolveAdminVisitPayment
      tags: [admin]
      summary: Release a held visit balance after review
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVisitResolutionInput" }
      responses:
        "200":
          description: Visit balance released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVisitPayment" }
        "400": { description: Invalid resolution }
        "403": { description: Administrator access required }
        "404": { description: Visit payment not found }
        "409": { description: Visit payment cannot be released }
  /admin/reviews:
    get:
      operationId: listAdminReviews
      tags: [admin]
      summary: Search review records
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Review page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReviewPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/recommendations:
    get:
      operationId: listAdminRecommendations
      tags: [admin]
      summary: Search recommendation records
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: visibility, schema: { type: string, enum: [publica, privada] } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Recommendation page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRecommendationPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/recommendations/{id}/visibility:
    patch:
      operationId: updateAdminRecommendationVisibility
      tags: [admin]
      summary: Change the public visibility of a recommendation
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRecommendationVisibilityInput" }
      responses:
        "200":
          description: Updated recommendation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRecommendation" }
        "400": { description: Invalid visibility }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Recommendation not found }
  /admin/ranking:
    get:
      operationId: getAdminRecommendationRanking
      tags: [admin]
      summary: Get the production-gated recommendation ranking review queue
      description: Returns no signals until a real, confirmed job payment exists in the production environment.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ranking activation, review candidates, and recent decisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRecommendationRanking" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/ranking/incidents/{jobId}:
    post:
      operationId: reviewAdminRecommendationRankingIncident
      tags: [admin]
      summary: Confirm or dismiss a structured activity signal
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: jobId, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRecommendationIncidentDecisionInput" }
      responses:
        "200":
          description: Review decision recorded in the audit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRecommendationIncidentDecisionResult" }
        "400": { description: Invalid decision or reason }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Job not found }
        "409": { description: Signal is no longer reviewable or ranking is inactive }
  /admin/catalog:
    get:
      operationId: listAdminCatalog
      tags: [admin]
      summary: List active and inactive service catalog entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Catalog entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
    post:
      operationId: createAdminCatalogItem
      tags: [admin]
      summary: Add an entry to the service catalog
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCatalogInput" }
      responses:
        "201":
          description: Created catalog entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "400": { description: Invalid catalog entry }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "409": { description: Catalog entry already exists }
  /admin/catalog/{id}:
    patch:
      operationId: updateAdminCatalogItem
      tags: [admin]
      summary: Update or deactivate a service catalog entry
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCatalogUpdate" }
      responses:
        "200":
          description: Updated catalog entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "400": { description: Invalid catalog entry }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Catalog entry not found }
        "409": { description: Catalog entry already exists }
  /admin/resources:
    get:
      operationId: listAdminResources
      tags: [admin]
      summary: Inventory public Partner portfolio and profile image metadata
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Resource metadata page; private chat content is not included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResourcePage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/activity:
    get:
      operationId: listAdminActivity
      tags: [admin]
      summary: List auditable administrative and operational events
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: entity, schema: { type: string } }
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Audit event page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminActivityPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/verificaciones:
    get:
      operationId: listAdminVerifications
      tags: [admin]
      summary: List private Partner verification documents by status
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: estado, schema: { type: string, enum: [pending_verification, verified, rejected] } }
      responses:
        "200":
          description: Verification documents for authorized administrative review
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminVerificationDocument" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/verificaciones/{id}:
    patch:
      operationId: resolveAdminVerification
      tags: [admin]
      summary: Approve or reject a pending verification document
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVerificationDecisionInput" }
      responses:
        "200":
          description: Verification decision and resulting Partner verification state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVerificationDecisionResult" }
        "400": { description: Invalid verification decision }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Verification document not found }
  /admin/client-verifications:
    get:
      operationId: listAdminClientVerifications
      tags: [admin]
      summary: List customer identity requests awaiting private review
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: page, schema: { type: number, minimum: 1 } }
        - { in: query, name: limit, schema: { type: number, minimum: 1, maximum: 100 } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
      responses:
        "200":
          description: Pending customer identity cases without private file paths
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientIdentityVerificationPage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/client-verifications/{id}:
    patch:
      operationId: reviewAdminClientVerification
      tags: [admin]
      summary: Approve or reject a customer identity request and delete its files
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminClientIdentityVerificationReviewInput" }
      responses:
        "200":
          description: Final identity decision after private images are deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientIdentityVerificationStatus" }
        "400": { description: Invalid decision or rejection reason }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Identity request not found }
        "409": { description: The request is not awaiting review }
        "500": { description: Files could not be deleted; the decision remains queued for retry }
  /admin/client-verifications/{id}/files/{kind}:
    get:
      operationId: getAdminClientVerificationFile
      tags: [admin]
      summary: Stream one private customer identity image to an administrator
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
        - { in: path, name: kind, required: true, schema: { type: string, enum: [dni, selfie] } }
      responses:
        "200":
          description: Private image, streamed with no-store cache policy
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Image not found }
        "409": { description: Verification document already resolved }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Prepare a signed upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Signed upload destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
        "400": { description: Invalid upload metadata }
        "403": { description: Not allowed to upload to this conversation }
        "500": { description: Could not prepare the upload }
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create an account and send an email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRegisterInput" }
      responses:
        "202":
          description: Account created; email verification is required before sign-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailVerificationMessage" }
        "400": { description: Invalid registration data }
        "409": { description: Email already in use }
        "429": { description: Verification code delivery is temporarily throttled }
        "503": { description: Email verification delivery unavailable }
  /auth/email-verification/registration/request:
    post:
      operationId: requestRegistrationEmailVerification
      tags: [auth]
      summary: Resend a registration email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationEmailVerificationRequest" }
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailVerificationMessage" }
        "400": { description: Invalid email }
        "429": { description: Too many requests }
        "503": { description: Email verification delivery unavailable }
  /auth/email-verification/registration/confirm:
    post:
      operationId: confirmRegistrationEmailVerification
      tags: [auth]
      summary: Confirm a registration code and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationEmailVerificationConfirmation" }
      responses:
        "200":
          description: Verified account session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { description: "Invalid, expired, or already used code" }
        "429": { description: Too many attempts }
  /auth/email-verification/account/request:
    post:
      operationId: requestAccountEmailVerification
      tags: [auth]
      summary: Send a one-time code to verify the current account email
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Verification code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailVerificationMessage" }
        "401": { description: Authentication required }
        "409": { description: Email already verified }
        "429": { description: Too many requests }
        "503": { description: Email delivery unavailable }
  /auth/email-verification/account/confirm:
    post:
      operationId: confirmAccountEmailVerification
      tags: [auth]
      summary: Confirm a code for the current account email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountEmailVerificationConfirmation" }
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailVerificationResult" }
        "400": { description: "Invalid, expired, or already used code" }
        "401": { description: Authentication required }
        "429": { description: Too many attempts }
  /auth/admin-signup/request:
    post:
      operationId: requestAdminSignupCode
      tags: [auth]
      summary: Request a verification code for an allowlisted administrator email
      description: Sends a one-time code only when the email is in the server-side allowlist. The response does not reveal allowlist membership.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSignupRequest" }
      responses:
        "202":
          description: Generic response whether or not a code was sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSignupRequestResult" }
        "400": { description: Invalid email }
        "429": { description: Too many attempts }
        "503": { description: Admin signup is not configured or email delivery is unavailable }
  /auth/admin-signup/complete:
    post:
      operationId: completeAdminSignup
      tags: [auth]
      summary: Create or promote an account after email verification
      description: Requires an allowlisted email, a valid one-time code, and the existing password when the Worky account already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSignupCompletion" }
      responses:
        "200":
          description: Existing account promoted or already administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "201":
          description: New administrator account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { description: Invalid or expired code or invalid input }
        "401": { description: Existing account password did not match }
        "409": { description: Existing account cannot be activated by this flow }
        "422": { description: New administrator password must have at least 12 characters }
        "429": { description: Too many attempts }
        "503": { description: Admin signup is not configured }
  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Sign in to an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthCredentials" }
      responses:
        "200":
          description: Account session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "202":
          description: Email verification required for this sign-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorLoginChallenge" }
        "401": { description: Invalid email or password }
        "403": { description: Email verification required }
  /auth/login/verify:
    post:
      operationId: verifyTwoFactorLogin
      tags: [auth]
      summary: Verify an email code for a sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorLoginVerification" }
      responses:
        "200":
          description: Account session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { description: "Invalid, expired, or already-used code" }
        "429": { description: Too many attempts }
  /auth/security/two-factor:
    get:
      operationId: getTwoFactorSecurity
      tags: [auth]
      summary: Get two-factor security status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Two-factor status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSecurityStatus" }
        "401": { description: Authentication required }
    put:
      operationId: updateTwoFactorSecurity
      tags: [auth]
      summary: Enable or disable email two-factor verification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorSecurityUpdate" }
      responses:
        "200":
          description: Updated security status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSecurityStatus" }
        "400": { description: Invalid request or unverified email }
        "401": { description: Current password did not match }
  /auth/mobile-login/request:
    post:
      operationId: requestMobileDeviceLogin
      tags: [auth]
      summary: Sign in on a trusted mobile installation or request a one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileDeviceLoginRequest" }
      responses:
        "200":
          description: Session issued for a previously verified device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileDeviceLoginResult" }
        "202":
          description: Code sent to verify this mobile installation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileDeviceLoginResult" }
        "401": { description: Invalid email or password }
        "403": { description: Email verification required }
        "429": { description: Too many attempts }
        "503": { description: Code delivery unavailable }
  /auth/mobile-login/confirm:
    post:
      operationId: confirmMobileDeviceLogin
      tags: [auth]
      summary: Confirm a one-time code and trust the mobile installation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileDeviceLoginConfirmation" }
      responses:
        "200":
          description: Session issued and device trusted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { description: Invalid or expired code }
        "429": { description: Too many attempts }
        "503": { description: Code delivery unavailable }
  /auth/mobile-devices:
    get:
      operationId: listMyTrustedMobileDevices
      tags: [auth]
      summary: List trusted mobile installations for the current account
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Trusted installations without internal database identifiers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileTrustedDevices" }
        "401": { description: Authentication required }
  /auth/mobile-devices/{deviceKey}:
    delete:
      operationId: revokeMyTrustedMobileDevice
      tags: [auth]
      summary: Revoke a trusted mobile installation for the current account
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: deviceKey
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" }
      responses:
        "204": { description: Trusted installation revoked }
        "401": { description: Authentication required }
        "404": { description: Installation not found for the current account }
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: End the current session
      responses:
        "204": { description: Session ended }
        "401": { description: Invalid session }
  /auth/me:
    get:
      operationId: getMyAccount
      tags: [professionals]
      summary: Get the current account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { description: Invalid session }
    patch:
      operationId: updateMyAccount
      tags: [professionals]
      summary: Update the current account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: Invalid account data }
        "401": { description: Current password required or invalid session }
        "409": { description: Email already in use }
  /auth/client-verification:
    get:
      operationId: getClientIdentityVerificationStatus
      tags: [auth]
      summary: Read the current customer's identity verification status
      security:
        - bearerAuth: []
      responses:
